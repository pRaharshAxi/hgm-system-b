version: '3.8'
services:
  mongodb:
    image: mongo:7.0
    container_name: hgm_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hgm_system_b
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: hgm_elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=hgm_elastic_password
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:hgm_elastic_password http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 20s
      timeout: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hgm_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7.2.4-alpine
    container_name: hgm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  elasticsearch_data:
  rabbitmq_data:
  redis_data:
